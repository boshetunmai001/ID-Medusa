upstream backend {
  server 127.0.0.1:3005;
}

upstream auth {
  server 127.0.0.1:3007;
}

upstream oidc {
  server 127.0.0.1:3003;
}

server {
  listen 9090 default_server;
  server_name _;
  access_log off;
  error_log /dev/null crit;

  client_header_buffer_size 512k;
  large_client_header_buffers 4 512k;
  client_max_body_size 12m;

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  location = /.well-known/openid-configuration {
    proxy_set_header Host localhost:9090;
    proxy_set_header X-Forwarded-Host localhost:9090;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Port 9090;
    proxy_pass http://oidc/oidc/.well-known/openid-configuration;
  }

  location ^~ /api/oidc {
    rewrite ^/api(/oidc.*)$ $1 break;
    proxy_set_header Host localhost:9090;
    proxy_set_header X-Forwarded-Host localhost:9090;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Port 9090;
    proxy_pass http://oidc;
  }

  location /oidc {
    proxy_set_header Host localhost:9090;
    proxy_set_header X-Forwarded-Host localhost:9090;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Port 9090;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_pass http://oidc;
  }

  location ^~ /interaction/ {
    rewrite ^/interaction/(.*)$ /api/interaction/$1 break;
    proxy_set_header Host localhost:9090;
    proxy_set_header X-Forwarded-Host localhost:9090;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Port 9090;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_pass http://backend;
  }

  location /auth {
    proxy_set_header Host localhost:9090;
    proxy_set_header X-Forwarded-Host localhost:9090;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Port 9090;
    proxy_pass http://auth;
  }

  location ~ ^/(api|public|widget|docs) {
    proxy_set_header Host localhost:9090;
    proxy_set_header X-Forwarded-Host localhost:9090;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Port 9090;
    proxy_pass http://backend;
  }
}

# Include only inside existing proxy locations matching these four exact paths:
# /auth/customer/encvoy-customer
# /auth/customer/encvoy-customer/callback
# /auth/user/encvoy-user
# /auth/user/encvoy-user/callback
# Tune burst for the expected number of users behind one IP.
limit_req zone=medusa_encvoy_auth burst=10 nodelay;
limit_req_status 429;
# Rejected requests log the full request line at this level. For auth start
# paths, also include medusa-auth-rate-limit-error-log-location.nginx.conf to
# filter these warnings while retaining error-level diagnostics. Callback
# locations that carry query values should instead use the sensitive callback
# error-log snippet.
limit_req_log_level warn;

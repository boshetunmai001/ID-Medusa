# Include once inside nginx's `http {}` block.
# `$uri` is normalized and excludes query arguments. Do not replace it with
# `$request`, `$request_uri`, `$args`, `$http_referer`, or authorization headers.
log_format medusa_safe escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","client_ip":"$remote_addr",'
  '"method":"$request_method","path":"$uri","status":$status,'
  '"bytes_sent":$body_bytes_sent,"duration_seconds":$request_time}';
